<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOK DUEL // NEO-BRUTAL V2</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Syncopate:wght@700;900&display=swap');

        :root {
            --bg: #0f0f0f;
            --border: #f4f4f0;
            --text: #f4f4f0;
            --acc-red: #FF2A4D;
            --acc-yellow: #FFD600;
            --acc-blue: #00E5FF;
            --acc-pink: #FF00FF;
            --panel-width: 50vw;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg);
            /* Brutalist dotted grid texture */
            background-image: radial-gradient(rgba(244, 244, 240, 0.15) 2px, transparent 2px);
            background-size: 30px 30px;
            color: var(--text);
            overflow: hidden;
            height: 100vh;
        }

        /* Continuous Marquee Banner */
        .marquee {
            position: fixed;
            top: 0;
            width: 100%;
            background: var(--acc-yellow);
            color: var(--bg);
            font-family: 'Syncopate', sans-serif;
            font-weight: 900;
            font-size: 1.2rem;
            padding: 8px 0;
            white-space: nowrap;
            overflow: hidden;
            border-bottom: 4px solid var(--border);
            z-index: 200;
        }

        .marquee span {
            display: inline-block;
            animation: scroll 15s linear infinite;
        }

        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        #game-viewport {
            display: flex;
            width: 200vw; 
            height: 100vh;
            padding-top: 40px; /* Offset for marquee */
            transition: transform 0.7s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .panel {
            width: var(--panel-width);
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        #panel-left {
            border-right: 6px dashed var(--border);
        }

        /* Refined Card Styling */
        .book-card {
            width: 300px;
            height: 450px;
            background: var(--bg);
            border: 6px solid var(--border);
            box-shadow: 12px 12px 0px var(--border);
            margin-bottom: 2.5rem;
            position: relative;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .book-card:hover {
            transform: translate(-4px, -4px);
            box-shadow: 16px 16px 0px var(--acc-pink);
        }

        .book-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(1.2) saturate(1.2);
            border-bottom: 6px solid var(--border);
        }

        /* Staggered Labels */
        .title-box {
            background: var(--border);
            color: var(--bg);
            padding: 12px 24px;
            font-family: 'Syncopate', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            text-align: center;
            border: 4px solid var(--bg);
            position: absolute;
            bottom: -20px;
            left: -20px;
            right: -20px;
            box-shadow: 6px 6px 0px var(--acc-blue);
        }

        #panel-left .title-box { box-shadow: 6px 6px 0px var(--acc-red); }

        .stats {
            font-family: 'Syncopate', sans-serif;
            font-size: 4.5rem;
            font-weight: 900;
            line-height: 1;
            margin: 1rem 0;
            text-shadow: 4px 4px 0px rgba(255,255,255,0.2);
        }

        .subtext {
            font-size: 1rem;
            letter-spacing: 2px;
            background: var(--bg);
            padding: 5px 15px;
            border: 2px solid var(--border);
        }

        /* Chunky Controls */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            width: 280px;
            margin-top: 1rem;
        }

        .btn {
            background: var(--bg);
            border: 4px solid var(--border);
            color: var(--text);
            padding: 18px;
            font-family: 'Syncopate', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 8px 8px 0px var(--border);
            transition: all 0.1s;
        }

        .btn-high:hover {
            background: var(--acc-yellow);
            color: var(--bg);
            border-color: var(--acc-yellow);
            box-shadow: 8px 8px 0px var(--acc-red);
        }

        .btn-low:hover {
            background: var(--acc-blue);
            color: var(--bg);
            border-color: var(--acc-blue);
            box-shadow: 8px 8px 0px var(--acc-pink);
        }

        .btn:active {
            transform: translate(6px, 6px);
            box-shadow: 2px 2px 0px var(--border) !important;
        }

        /* UI Overlays */
        #score-tab {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: var(--border);
            color: var(--bg);
            padding: 12px 24px;
            border: 4px solid var(--border);
            font-family: 'Syncopate', sans-serif;
            font-weight: 900;
            font-size: 1.5rem;
            box-shadow: 8px 8px 0px var(--acc-red);
            z-index: 100;
            transform: rotate(-2deg);
        }

        .vs-badge {
            position: absolute;
            right: -50px;
            top: 50%;
            transform: translateY(-50%) rotate(10deg);
            background: var(--acc-pink);
            color: var(--bg);
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-family: 'Syncopate', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            z-index: 50;
            border: 6px solid var(--border);
            box-shadow: inset -4px -4px 0px rgba(0,0,0,0.3);
        }

        .hidden { display: none !important; }
        
        /* Aggressive Flash Feedback */
        #feedback {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Syncopate', sans-serif;
            font-weight: 900;
            font-size: 12rem;
            opacity: 0;
            transition: opacity 0.2s;
            mix-blend-mode: exclusion;
        }
    </style>
</head>
<body>

    <div class="marquee">
        <span>BOOK DUEL // WHICH HAS MORE COPIES IN CIRCULATION? // TRUST YOUR INSTINCTS // BOOK DUEL // WHICH HAS MORE COPIES IN CIRCULATION? // TRUST YOUR INSTINCTS // </span>
    </div>

    <div id="score-tab">STREAK: 0</div>
    <div id="feedback"></div>

    <div id="game-viewport">
        <section class="panel" id="panel-left">
            <div class="vs-badge">VS</div>
            <div class="book-card">
                <img id="l-img" class="book-cover" src="" alt="">
                <div class="title-box" id="l-title">LOADING...</div>
            </div>
            <div class="stats" id="l-sales">0</div>
            <p class="subtext">MILLION COPIES</p>
        </section>

        <section class="panel" id="panel-right">
            <div class="book-card">
                <img id="r-img" class="book-cover" src="" alt="">
                <div class="title-box" id="r-title">...</div>
            </div>
            
            <div class="controls" id="ui-actions">
                <button class="btn btn-high" onclick="guess('higher')">HIGHER ↑</button>
                <button class="btn btn-low" onclick="guess('lower')">LOWER ↓</button>
            </div>

            <div id="ui-reveal" class="hidden" style="text-align: center;">
                <div class="stats" id="r-sales">0</div>
                <p class="subtext">MILLION COPIES</p>
            </div>
        </section>
    </div>

<script>
    // Curated High-Volume Popular Books (Estimated Sales in Millions)
    const library = [
        { title: "The Martian", sales: 12 },
        { title: "Dune", sales: 20 },
        { title: "1984", sales: 30 },
        { title: "Brave New World", sales: 14 },
        { title: "The Hitchhiker's Guide to the Galaxy", sales: 15 },
        { title: "Harry Potter and the Sorcerer's Stone", sales: 120 },
        { title: "The Lord of the Rings", sales: 150 },
        { title: "The Da Vinci Code", sales: 80 },
        { title: "The Alchemist", sales: 65 },
        { title: "The Catcher in the Rye", sales: 65 },
        { title: "To Kill a Mockingbird", sales: 40 },
        { title: "The Great Gatsby", sales: 30 },
        { title: "The Hunger Games", sales: 28 },
        { title: "Gone Girl", sales: 15 },
        { title: "The Fault in Our Stars", sales: 23 },
        { title: "The Book Thief", sales: 16 },
        { title: "Crime and Punishment", sales: 10 },
        { title: "Life of Pi", sales: 10 },
        { title: "A Game of Thrones", sales: 90 },
        { title: "Normal People", sales: 3 },
        { title: "The Silent Patient", sales: 6.5 },
        { title: "It Ends With Us", sales: 4 },
        { title: "Fahrenheit 451", sales: 10 },
        { title: "Ready Player One", sales: 4 },
        { title: "The Girl with the Dragon Tattoo", sales: 30 }
    ];

    let score = 0;
    let currentL, currentR;
    let stack = [];

    async function getCover(title) {
        try {
            const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(title)}&maxResults=1`);
            const data = await res.json();
            return data.items[0].volumeInfo.imageLinks.thumbnail.replace('http:', 'https:');
        } catch {
            return 'https://via.placeholder.com/300x450/0f0f0f/f4f4f0?text=NO+IMAGE';
        }
    }

    function shuffle() {
        stack = [...library].sort(() => Math.random() - 0.5);
    }

    async function nextRound(isFirst = false) {
        if (stack.length < 2) shuffle();

        if (isFirst) {
            currentL = stack.pop();
            currentL.img = await getCover(currentL.title);
        } else {
            currentL = currentR;
        }

        currentR = stack.pop();
        currentR.img = await getCover(currentR.title);

        renderUI();
    }

    function renderUI() {
        document.getElementById('game-viewport').style.transform = 'translateX(0)';
        
        document.getElementById('l-title').textContent = currentL.title;
        document.getElementById('l-sales').textContent = currentL.sales;
        document.getElementById('l-img').src = currentL.img;

        document.getElementById('r-title').textContent = currentR.title;
        document.getElementById('r-img').src = currentR.img;

        document.getElementById('ui-actions').classList.remove('hidden');
        document.getElementById('ui-reveal').classList.add('hidden');
    }

    function guess(dir) {
        const win = dir === 'higher' ? currentR.sales >= currentL.sales : currentR.sales <= currentL.sales;
        
        document.getElementById('ui-actions').classList.add('hidden');
        document.getElementById('ui-reveal').classList.remove('hidden');
        
        animateValue("r-sales", 0, currentR.sales, 500);

        setTimeout(() => {
            showFeedback(win);
            if (win) {
                score++;
                document.getElementById('score-tab').textContent = `STREAK: ${score}`;
                setTimeout(slideTransition, 1200);
            } else {
                score = 0;
                document.getElementById('score-tab').textContent = `STREAK: 0`;
                setTimeout(renderUI, 1200);
            }
        }, 600);
    }

    function showFeedback(win) {
        const el = document.getElementById('feedback');
        el.textContent = win ? 'CORRECT' : 'DEAD';
        el.style.color = win ? 'var(--acc-blue)' : 'var(--acc-red)';
        
        // Add a harsh background flash
        document.body.style.backgroundColor = win ? '#001a1c' : '#2a0006';
        
        el.style.opacity = '1';
        setTimeout(() => {
            el.style.opacity = '0';
            document.body.style.backgroundColor = 'var(--bg)';
        }, 1000);
    }

    function slideTransition() {
        document.getElementById('game-viewport').style.transform = 'translateX(-50vw)';
        setTimeout(() => nextRound(false), 700);
    }

    function animateValue(id, start, end, duration) {
        const obj = document.getElementById(id);
        let startTimestamp = null;
        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            obj.innerHTML = (progress * (end - start) + start).toFixed(1);
            if (progress >= 1) obj.innerHTML = end; // Ensure clean finish
            if (progress < 1) window.requestAnimationFrame(step);
        };
        window.requestAnimationFrame(step);
    }

    nextRound(true);
</script>
</body>
</html>
