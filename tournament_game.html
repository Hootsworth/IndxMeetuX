<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poéthra Championship Tournament</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --pkmn-blue-dark: #204070;
            --pkmn-blue-light: #5080c8;
            --pkmn-red: #c82010;
            --pkmn-gold: #f8b800;
            --pkmn-white: #f8f8f8;
            --pkmn-black: #080808;
            --pkmn-border: #404040;
            --bracket-line: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            image-rendering: pixelated;
        }

        body {
            font-family: 'Press Start 2P', cursive;
            background-color: var(--pkmn-blue-dark);
            color: var(--pkmn-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .screen {
            width: 100%;
            max-width: 1000px;
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .screen.active {
            display: flex;
        }

        /* Pokemon Gold Style Box */
        .pkmn-box {
            background-color: var(--pkmn-white);
            border: 4px solid var(--pkmn-border);
            padding: 4px;
            box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.3);
            color: var(--pkmn-black);
            width: 100%;
            margin-bottom: 20px;
        }

        .pkmn-box-inner {
            border: 2px solid var(--pkmn-border);
            padding: 20px;
            background-color: var(--pkmn-white);
        }

        h1 {
            font-size: 1.2rem;
            color: var(--pkmn-red);
            text-shadow: 2px 2px 0 #ccc;
            margin-bottom: 20px;
            text-align: center;
        }

        .exit-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: var(--pkmn-red);
            color: white;
            padding: 10px;
            border: 2px solid var(--pkmn-black);
            font-size: 0.6rem;
            text-decoration: none;
            z-index: 1000;
        }

        /* Setup Screen */
        .setup-input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: 3px solid var(--pkmn-black);
            font-family: inherit;
            font-size: 0.7rem;
        }

        .btn {
            background: var(--pkmn-blue-light);
            color: white;
            border: 3px solid var(--pkmn-black);
            padding: 15px 30px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.8rem;
            box-shadow: 4px 4px 0 var(--pkmn-black);
        }

        .btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--pkmn-black);
        }

        /* Matchup Screen */
        .matchup-container {
            display: flex;
            justify-content: space-around;
            width: 100%;
            gap: 20px;
            margin-top: 40px;
        }

        .artist-card {
            flex: 1;
            max-width: 400px;
            background: white;
            border: 4px solid var(--pkmn-black);
            padding: 15px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.2s;
        }

        .artist-card:hover {
            scale: 1.05;
            background: var(--pkmn-gold);
        }

        .artist-img {
            width: 200px;
            height: 200px;
            background-size: cover;
            background-position: center;
            border: 3px solid var(--pkmn-black);
            margin-bottom: 15px;
        }

        .artist-name {
            font-size: 0.8rem;
            text-align: center;
            color: black;
            line-height: 1.4;
        }

        .vs-text {
            display: flex;
            align-items: center;
            font-size: 2rem;
            color: var(--pkmn-gold);
            text-shadow: 4px 4px 0 var(--pkmn-black);
        }

        .round-info {
            font-size: 0.8rem;
            margin-bottom: 20px;
            color: var(--pkmn-gold);
        }

        /* Bracket View */
        .bracket {
            display: none;
            /* We'll focus on the interactive head-to-head for now */
        }

        /* Champion Screen */
        .champion-box {
            animation: bounce 0.5s infinite alternate;
            text-align: center;
        }

        @keyframes bounce {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-10px);
            }
        }

        .badge-unlock {
            margin-top: 30px;
            color: var(--pkmn-gold);
            font-size: 0.7rem;
            text-align: center;
            animation: flash 1s infinite;
        }

        @keyframes flash {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }
    </style>
</head>

<body>
    <a href="index.html" class="exit-btn">← LEAVE</a>

    <!-- 0. Auth Screen -->
    <div id="auth-screen" class="screen active">
        <div class="pkmn-box">
            <div class="pkmn-box-inner">
                <h1>PROF. OAK'S ARTIST LAB</h1>
                <p style="font-size: 0.6rem; line-height: 1.8; margin-bottom: 20px;">
                    Welcome to the Championship!
                    Please enter your Spotify Radio credentials to sync artist data.
                </p>
                <input type="text" id="client-id" class="setup-input" placeholder="SPOTIFY CLIENT ID">
                <input type="password" id="client-secret" class="setup-input" placeholder="SPOTIFY CLIENT SECRET">
                <button class="btn" onclick="saveCredentials()">SYNC DATA</button>
            </div>
        </div>
    </div>

    <!-- 1. Selection Screen -->
    <div id="setup-screen" class="screen">
        <div class="pkmn-box">
            <div class="pkmn-box-inner">
                <h1>SELECT TOURNAMENT SIZE</h1>
                <div style="display: flex; gap: 20px; justify-content: center;">
                    <button class="btn" onclick="startTournament(8)">Elite 8</button>
                    <button class="btn" onclick="startTournament(16)">Sweet 16</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. Matchup Screen -->
    <div id="game-screen" class="screen">
        <div class="round-info" id="round-title">ROUND 1 - MATCH 1</div>
        <div class="matchup-container">
            <div class="artist-card" onclick="advanceArtist(0)">
                <div class="artist-img" id="img-0"></div>
                <div class="artist-name" id="name-0">ARTIST 1</div>
            </div>
            <div class="vs-text">VS</div>
            <div class="artist-card" onclick="advanceArtist(1)">
                <div class="artist-img" id="img-1"></div>
                <div class="artist-name" id="name-1">ARTIST 2</div>
            </div>
        </div>
    </div>

    <!-- 3. Champion Screen -->
    <div id="champion-screen" class="screen">
        <div class="champion-box">
            <h1 style="font-size: 2rem;">CHAMPION!</h1>
            <div class="artist-img" id="champ-img" style="width: 300px; height: 300px; border-width: 8px;"></div>
            <div class="artist-name" id="champ-name" style="font-size: 1.5rem; color: white;">...</div>
        </div>
        <div class="badge-unlock">
            YOU EARNED THE MINERAL BADGE! 💎
        </div>
        <button class="btn" style="margin-top: 40px;" onclick="location.href='index.html'">RETURN TO HALL OF
            FAME</button>
    </div>

    <script>
        const API_KEY_ID = 'spotify_client_id';
        const API_KEY_SECRET = 'spotify_client_secret';

        let accessToken = '';
        let tournamentArtists = [];
        let nextRoundArtists = [];
        let currentMatchup = [null, null];
        let matchIndex = 0;
        let roundCount = 1;

        const popularArtists = [
            'Taylor Swift', 'Drake', 'The Weeknd', 'Billie Eilish', 'Ariana Grande',
            'Ed Sheeran', 'Justin Bieber', 'Dua Lipa', 'Olivia Rodrigo', 'Bad Bunny',
            'Travis Scott', 'Kendrick Lamar', 'Post Malone', 'SZA', 'Harry Styles',
            'Doja Cat', 'Imagine Dragons', 'Coldplay', 'Lana Del Rey', 'Bruno Mars',
            'Rihanna', 'Eminem', 'Kanye West', 'Tyler, The Creator', 'Frank Ocean',
            'Arctic Monkeys', 'One direction', 'Selena Gomez', 'Radiohead', 'Micheal Jackson',
            'Linkin Park', 'Twenty One Pilots', 'Jonas brothers', 'Justin Timberlake', 'Alan Walker',
            'Charlie Puth', 'Calvin Harris', 'David Guetta', 'Marshmello', 'Skrillex',
            'BTS', 'BLACKPINK', 'ROSÉ', 'Arijit Singh', 'Pritam',
            'Shreya Ghoshal', 'A. R. Rahman', 'Neha Kakkar', 'Badshah', 'Diljit Dosanjh',
            'AP Dhillon', 'Playboi Carti', 'Creed', 'Cardi B', 'Nicki Minaj',
            'Fred again..', 'Katy Perry', 'Britney Spears', 'Lady Gaga', 'Don Toliver',
            'DJ Khaled', 'Deftones', 'Red Hot Chili Peppers', 'Pharrell Williams', 'Lil Tecca',
            'Shakira', 'Sean Paul', 'Sabrina Carpenter', 'Djo', 'Zara Larsson',
            'Chris Brown', 'Olivia Dean', 'sombr', 'Adele', 'Halsey',
            'will.i.am', 'DJ Snake', 'Elton John', 'The Beatles', 'American Authors',
            'Shawn Mendes', 'Camila Cabello', 'Benson Boone', 'Sam Smith', 'Sia',
            'Avicii', 'Kygo', 'Major Lazer', 'Khalid', 'Jason Derulo',
            'OneRepublic', 'The Chainsmokers', 'ABBA', 'Maroon 5'
        ];

        async function saveCredentials() {
            const id = document.getElementById('client-id').value;
            const secret = document.getElementById('client-secret').value;
            if (!id || !secret) return alert('Enter ID and Secret');
            localStorage.setItem(API_KEY_ID, id);
            localStorage.setItem(API_KEY_SECRET, secret);
            init();
        }

        async function getAccessToken() {
            const id = localStorage.getItem(API_KEY_ID);
            const secret = localStorage.getItem(API_KEY_SECRET);
            if (!id) return null;
            const res = await fetch('https://accounts.spotify.com/api/token', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'Authorization': 'Basic ' + btoa(id + ':' + secret)
                },
                body: 'grant_type=client_credentials'
            });
            const data = await res.json();
            return data.access_token;
        }

        async function fetchArtist(name) {
            const res = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(name)}&type=artist&limit=1`, {
                headers: { 'Authorization': 'Bearer ' + accessToken }
            });
            const data = await res.json();
            return data.artists.items[0];
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        async function init() {
            accessToken = await getAccessToken();
            if (accessToken) {
                showScreen('setup-screen');
            }
        }

        async function startTournament(size) {
            const shuffled = [...popularArtists].sort(() => 0.5 - Math.random());
            const selection = shuffled.slice(0, size);

            showScreen('game-screen');
            document.getElementById('round-title').textContent = "LOADING DATA...";

            tournamentArtists = await Promise.all(selection.map(name => fetchArtist(name)));
            setupMatchup();
        }

        function setupMatchup() {
            if (tournamentArtists.length === 1) {
                showChampion(tournamentArtists[0]);
                return;
            }

            if (matchIndex * 2 >= tournamentArtists.length) {
                // Round complete
                tournamentArtists = nextRoundArtists;
                nextRoundArtists = [];
                matchIndex = 0;
                roundCount++;
                setupMatchup();
                return;
            }

            const a1 = tournamentArtists[matchIndex * 2];
            const a2 = tournamentArtists[matchIndex * 2 + 1];
            currentMatchup = [a1, a2];

            document.getElementById('round-title').textContent = `ROUND ${roundCount} - MATCH ${matchIndex + 1}`;

            document.getElementById('name-0').textContent = a1.name;
            document.getElementById('img-0').style.backgroundImage = `url(${a1.images[0]?.url})`;

            document.getElementById('name-1').textContent = a2.name;
            document.getElementById('img-1').style.backgroundImage = `url(${a2.images[0]?.url})`;
        }

        function advanceArtist(index) {
            nextRoundArtists.push(currentMatchup[index]);
            matchIndex++;
            setupMatchup();
        }

        function showChampion(artist) {
            showScreen('champion-screen');
            document.getElementById('champ-name').textContent = artist.name;
            document.getElementById('champ-img').style.backgroundImage = `url(${artist.images[0]?.url})`;

            // Award Badge
            let badges = JSON.parse(localStorage.getItem('poethra_badges') || '{}');
            badges['tournament'] = true;
            localStorage.setItem('poethra_badges', JSON.stringify(badges));
        }

        // Check if already authed
        if (localStorage.getItem(API_KEY_ID)) {
            document.getElementById('client-id').value = localStorage.getItem(API_KEY_ID);
            document.getElementById('client-secret').value = localStorage.getItem(API_KEY_SECRET);
            init();
        }
    </script>
</body>

</html>
