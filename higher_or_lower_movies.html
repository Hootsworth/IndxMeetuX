<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOX OFFICE DUEL // NEO-BRUTAL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Syncopate:wght@700;900&display=swap');

        :root {
            --bg: #0a0a0a;
            --border: #e8e8e3;
            --text: #e8e8e3;
            --acc-red: #FF1040;
            --acc-yellow: #E5FF00;
            --acc-blue: #00F0FF;
            --acc-pink: #FF00AA;
            --panel-width: 50vw;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(rgba(232, 232, 227, 0.1) 2px, transparent 2px);
            background-size: 30px 30px;
            color: var(--text);
            overflow: hidden;
            height: 100vh;
        }

        /* Cinematic Film Grain Overlay */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)"/></svg>');
            opacity: 0.06;
            pointer-events: none;
            z-index: 9999;
        }

        /* Continuous Marquee Banner */
        .marquee {
            position: fixed;
            top: 0;
            width: 100%;
            background: var(--acc-yellow);
            color: var(--bg);
            font-family: 'Syncopate', sans-serif;
            font-weight: 900;
            font-size: 1.2rem;
            padding: 8px 0;
            white-space: nowrap;
            overflow: hidden;
            border-bottom: 4px solid var(--border);
            z-index: 200;
        }

        .marquee span {
            display: inline-block;
            animation: scroll 20s linear infinite;
        }

        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        #game-viewport {
            display: flex;
            width: 200vw; 
            height: 100vh;
            padding-top: 40px; 
            transition: transform 0.7s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .panel {
            width: var(--panel-width);
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        #panel-left {
            border-right: 6px dashed var(--border);
        }

        /* Refined Card Styling */
        .movie-card {
            width: 300px;
            height: 450px;
            background: var(--bg);
            border: 6px solid var(--border);
            box-shadow: 12px 12px 0px var(--border);
            margin-bottom: 2.5rem;
            position: relative;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .movie-card:hover {
            transform: translate(-4px, -4px);
            box-shadow: 16px 16px 0px var(--acc-pink);
        }

        .poster {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(1.1) saturate(1.1);
            border-bottom: 6px solid var(--border);
        }

        /* Staggered Labels */
        .title-box {
            background: var(--border);
            color: var(--bg);
            padding: 12px 24px;
            font-family: 'Syncopate', sans-serif;
            font-size: 1.1rem;
            font-weight: 900;
            text-transform: uppercase;
            text-align: center;
            border: 4px solid var(--bg);
            position: absolute;
            bottom: -20px;
            left: -20px;
            right: -20px;
            box-shadow: 6px 6px 0px var(--acc-blue);
        }

        #panel-left .title-box { box-shadow: 6px 6px 0px var(--acc-red); }

        .stats {
            font-family: 'Syncopate', sans-serif;
            font-size: 4.5rem;
            font-weight: 900;
            line-height: 1;
            margin: 1rem 0;
            text-shadow: 4px 4px 0px rgba(255,255,255,0.1);
            color: var(--acc-yellow);
        }

        .subtext {
            font-size: 1rem;
            letter-spacing: 2px;
            background: var(--text);
            color: var(--bg);
            font-weight: 700;
            padding: 5px 15px;
            border: 2px solid var(--bg);
        }

        /* Chunky Controls */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            width: 280px;
            margin-top: 1rem;
        }

        .btn {
            background: var(--bg);
            border: 4px solid var(--border);
            color: var(--text);
            padding: 18px;
            font-family: 'Syncopate', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 8px 8px 0px var(--border);
            transition: all 0.1s;
        }

        .btn-high:hover {
            background: var(--acc-yellow);
            color: var(--bg);
            border-color: var(--acc-yellow);
            box-shadow: 8px 8px 0px var(--acc-red);
        }

        .btn-low:hover {
            background: var(--acc-blue);
            color: var(--bg);
            border-color: var(--acc-blue);
            box-shadow: 8px 8px 0px var(--acc-pink);
        }

        .btn:active {
            transform: translate(6px, 6px);
            box-shadow: 2px 2px 0px var(--border) !important;
        }

        /* UI Overlays */
        #score-tab {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: var(--border);
            color: var(--bg);
            padding: 12px 24px;
            border: 4px solid var(--border);
            font-family: 'Syncopate', sans-serif;
            font-weight: 900;
            font-size: 1.5rem;
            box-shadow: 8px 8px 0px var(--acc-red);
            z-index: 100;
            transform: rotate(-2deg);
        }

        .vs-badge {
            position: absolute;
            right: -50px;
            top: 50%;
            transform: translateY(-50%) rotate(10deg);
            background: var(--acc-pink);
            color: var(--bg);
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-family: 'Syncopate', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            z-index: 50;
            border: 6px solid var(--border);
            box-shadow: inset -4px -4px 0px rgba(0,0,0,0.3);
        }

        .hidden { display: none !important; }
        
        /* Aggressive Flash Feedback */
        #feedback {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Syncopate', sans-serif;
            font-weight: 900;
            font-size: 12rem;
            opacity: 0;
            transition: opacity 0.2s;
            mix-blend-mode: difference;
            color: white;
        }
    </style>
</head>
<body>

    <div class="marquee">
        <span>WORLDWIDE BOX OFFICE DUEL // WHICH FILM GROSSED MORE? // TRUST THE NUMBERS // WORLDWIDE BOX OFFICE DUEL // WHICH FILM GROSSED MORE? // TRUST THE NUMBERS // </span>
    </div>

    <div id="score-tab">STREAK: 0</div>
    <div id="feedback"></div>

    <div id="game-viewport">
        <section class="panel" id="panel-left">
            <div class="vs-badge">VS</div>
            <div class="movie-card">
                <img id="l-img" class="poster" src="" alt="">
                <div class="title-box" id="l-title">LOADING...</div>
            </div>
            <div class="stats" id="l-sales">$0</div>
            <p class="subtext">MILLION DOLLARS</p>
        </section>

        <section class="panel" id="panel-right">
            <div class="movie-card">
                <img id="r-img" class="poster" src="" alt="">
                <div class="title-box" id="r-title">...</div>
            </div>
            
            <div class="controls" id="ui-actions">
                <button class="btn btn-high" onclick="guess('higher')">HIGHER ↑</button>
                <button class="btn btn-low" onclick="guess('lower')">LOWER ↓</button>
            </div>

            <div id="ui-reveal" class="hidden" style="text-align: center;">
                <div class="stats" id="r-sales">$0</div>
                <p class="subtext">MILLION DOLLARS</p>
            </div>
        </section>
    </div>

<script>
    // Top Grossing Movies (Approximate Worldwide Gross in Millions)
    const library = [
        { title: "Avatar", sales: 2923 },
        { title: "Avengers: Endgame", sales: 2797 },
        { title: "Avatar: The Way of Water", sales: 2320 },
        { title: "Titanic", sales: 2257 },
        { title: "Star Wars: The Force Awakens", sales: 2068 },
        { title: "Avengers: Infinity War", sales: 2048 },
        { title: "Spider-Man: No Way Home", sales: 1921 },
        { title: "Jurassic World", sales: 1671 },
        { title: "The Lion King", sales: 1656 },
        { title: "The Avengers", sales: 1518 },
        { title: "Furious 7", sales: 1515 },
        { title: "Top Gun: Maverick", sales: 1495 },
        { title: "Frozen II", sales: 1450 },
        { title: "Barbie", sales: 1445 },
        { title: "Avengers: Age of Ultron", sales: 1402 },
        { title: "The Super Mario Bros. Movie", sales: 1361 },
        { title: "Black Panther", sales: 1347 },
        { title: "Harry Potter and the Deathly Hallows", sales: 1342 },
        { title: "Star Wars: The Last Jedi", sales: 1332 },
        { title: "Jurassic World: Fallen Kingdom", sales: 1309 },
        { title: "Frozen", sales: 1290 },
        { title: "Beauty and the Beast", sales: 1263 },
        { title: "Incredibles 2", sales: 1242 },
        { title: "The Fate of the Furious", sales: 1236 },
        { title: "Iron Man 3", sales: 1214 },
        { title: "Oppenheimer", sales: 968 },
        { title: "The Dark Knight", sales: 1006 },
        { title: "Joker", sales: 1078 },
        { title: "Skyfall", sales: 1108 },
        { title: "The Lord of the Rings: The Return of the King", sales: 1147 }
    ];

    let score = 0;
    let currentL, currentR;
    let stack = [];

    // Using iTunes Search API for reliable, high-res, key-free movie posters
    // Using AllOrigins CORS proxy to bypass browser security blocks on the iTunes API
    // Using Wikipedia's open CORS API for bulletproof, key-free poster fetching
    async function getPoster(title) {
        try {
            // First attempt: Try searching with " (film)" appended for accuracy
            const wikiTitle = encodeURIComponent(title + " (film)");
            const primaryUrl = `https://en.wikipedia.org/w/api.php?action=query&titles=${wikiTitle}&prop=pageimages&format=json&pithumbsize=600&origin=*`;
            
            let res = await fetch(primaryUrl);
            let data = await res.json();
            let pages = data.query.pages;
            let pageId = Object.keys(pages)[0];

            if (pageId !== "-1" && pages[pageId].thumbnail) {
                return pages[pageId].thumbnail.source;
            }

            // Fallback attempt: Search just the exact title if the first fails
            const fallbackUrl = `https://en.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(title)}&prop=pageimages&format=json&pithumbsize=600&origin=*`;
            res = await fetch(fallbackUrl);
            data = await res.json();
            pages = data.query.pages;
            pageId = Object.keys(pages)[0];

            if (pageId !== "-1" && pages[pageId].thumbnail) {
                return pages[pageId].thumbnail.source;
            }

            // Absolute fallback if Wikipedia has no image
            return 'https://via.placeholder.com/300x450/0a0a0a/e8e8e3?text=NO+POSTER';
            
        } catch (error) {
            console.error("Wikipedia API fetch failed:", error);
            return 'https://via.placeholder.com/300x450/FF1040/0a0a0a?text=BLOCKED';
        }
    }

    function shuffle() {
        stack = [...library].sort(() => Math.random() - 0.5);
    }

    async function nextRound(isFirst = false) {
        if (stack.length < 2) shuffle();

        if (isFirst) {
            currentL = stack.pop();
            currentL.img = await getPoster(currentL.title);
        } else {
            currentL = currentR;
        }

        currentR = stack.pop();
        currentR.img = await getPoster(currentR.title);

        renderUI();
    }

    function renderUI() {
        document.getElementById('game-viewport').style.transform = 'translateX(0)';
        
        document.getElementById('l-title').textContent = currentL.title;
        document.getElementById('l-sales').textContent = '$' + currentL.sales;
        document.getElementById('l-img').src = currentL.img;

        document.getElementById('r-title').textContent = currentR.title;
        document.getElementById('r-img').src = currentR.img;

        document.getElementById('ui-actions').classList.remove('hidden');
        document.getElementById('ui-reveal').classList.add('hidden');
    }

    function guess(dir) {
        const win = dir === 'higher' ? currentR.sales >= currentL.sales : currentR.sales <= currentL.sales;
        
        document.getElementById('ui-actions').classList.add('hidden');
        document.getElementById('ui-reveal').classList.remove('hidden');
        
        animateValue("r-sales", 0, currentR.sales, 600);

        setTimeout(() => {
            showFeedback(win);
            if (win) {
                score++;
                document.getElementById('score-tab').textContent = `STREAK: ${score}`;
                setTimeout(slideTransition, 1400);
            } else {
                score = 0;
                document.getElementById('score-tab').textContent = `STREAK: 0`;
                setTimeout(renderUI, 1400);
            }
        }, 700);
    }

    function showFeedback(win) {
        const el = document.getElementById('feedback');
        el.textContent = win ? 'BOX OFFICE HIT' : 'FLOP';
        
        // Add a harsh background flash
        document.body.style.backgroundColor = win ? '#001a1c' : '#2a0006';
        
        el.style.opacity = '1';
        setTimeout(() => {
            el.style.opacity = '0';
            document.body.style.backgroundColor = 'var(--bg)';
        }, 1000);
    }

    function slideTransition() {
        document.getElementById('game-viewport').style.transform = 'translateX(-50vw)';
        setTimeout(() => nextRound(false), 700);
    }

    function animateValue(id, start, end, duration) {
        const obj = document.getElementById(id);
        let startTimestamp = null;
        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            obj.innerHTML = '$' + Math.floor(progress * (end - start) + start);
            if (progress >= 1) obj.innerHTML = '$' + end; 
            if (progress < 1) window.requestAnimationFrame(step);
        };
        window.requestAnimationFrame(step);
    }

    nextRound(true);
</script>
</body>
</html>
