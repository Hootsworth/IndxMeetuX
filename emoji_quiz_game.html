<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Emoji Quiz by Poéthra</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --mario-sky: #5c94fc;
            --mario-ground: #943210;
            --mario-grass: #00a800;
            --mario-brick: #b03014;
            --mario-coin: #f8d800;
            --mario-cloud: #ffffff;
            --text-color: #ffffff;
            --shadow-color: #000000;
        }

        body {
            font-family: 'Press Start 2P', cursive;
            background-color: var(--mario-sky);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            overflow: hidden;
            image-rendering: pixelated;
        }

        /* Scrolling Clouds Background */
        .background-wrap {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .cloud {
            position: absolute;
            background: var(--mario-cloud);
            width: 100px;
            height: 40px;
            border-radius: 20px;
            opacity: 0.8;
            animation: moveClouds linear infinite;
            box-shadow: 10px 10px 0 #ddd;
        }

        .cloud::before,
        .cloud::after {
            content: '';
            position: absolute;
            background: var(--mario-cloud);
            border-radius: 50%;
        }

        .cloud::before {
            width: 50px;
            height: 50px;
            top: -25px;
            left: 15px;
        }

        .cloud::after {
            width: 40px;
            height: 40px;
            top: -20px;
            left: 45px;
        }

        @keyframes moveClouds {
            from {
                transform: translateX(110vw);
            }

            to {
                transform: translateX(-20vw);
            }
        }

        /* Ground */
        .ground {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: var(--mario-ground);
            border-top: 8px solid var(--mario-grass);
            z-index: -1;
            background-image:
                linear-gradient(90deg, transparent 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 40px 100%;
        }

        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.8rem;
            z-index: 100;
            padding: 10px;
            background: var(--mario-brick);
            border: 4px solid #000;
            box-shadow: 4px 4px 0 #000;
        }

        .exit-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.8rem;
            z-index: 100;
            padding: 10px;
            background: var(--mario-brick);
            border: 4px solid #000;
            box-shadow: 4px 4px 0 #000;
            cursor: pointer;
        }

        .exit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 6px 6px 0 #000;
        }

        .back-link:hover {
            transform: translateY(-2px);
            box-shadow: 6px 6px 0 #000;
        }

        .screen {
            width: 90%;
            max-width: 800px;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 40px;
            border: 8px solid #000;
            box-shadow: 10px 10px 0 rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .screen.active {
            display: flex;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 2rem;
            line-height: 1.5;
            text-shadow: 4px 4px 0 #000;
        }

        /* Start Screen */
        .team-inputs {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 2rem;
        }

        .team-inputs input {
            font-family: 'Press Start 2P', cursive;
            font-size: 1rem;
            background-color: #000;
            border: 4px solid #fff;
            color: #fff;
            padding: 15px;
            text-align: center;
            width: 300px;
        }

        .category-select {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .category-btn {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7rem;
            padding: 15px;
            border: 4px solid #000;
            background-color: var(--mario-brick);
            color: #fff;
            cursor: pointer;
            box-shadow: 4px 4px 0 #000;
            transition: all 0.1s;
            position: relative;
        }

        .category-btn::after {
            content: '?';
            position: absolute;
            top: 2px;
            right: 2px;
            font-size: 0.5rem;
            opacity: 0.5;
        }

        .category-btn:hover {
            transform: scale(1.05);
            background-color: #e04020;
        }

        .category-btn.active {
            background-color: var(--mario-coin);
            color: #000;
            animation: bounce 0.5s infinite alternate;
        }

        @keyframes bounce {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-5px);
            }
        }

        #start-button {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.2rem;
            padding: 20px 40px;
            border: 4px solid #000;
            background-color: var(--mario-grass);
            color: #fff;
            cursor: pointer;
            box-shadow: 6px 6px 0 #000;
        }

        #start-button:hover {
            transform: translateY(-4px);
            box-shadow: 10px 10px 0 #000;
        }

        /* Game HUD */
        #score-container {
            position: absolute;
            top: -60px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            padding: 0 10px;
        }

        .hud-label {
            display: block;
            margin-bottom: 5px;
            color: #fff;
        }

        .hud-val {
            color: var(--mario-coin);
        }

        #question-counter {
            font-size: 0.6rem;
            color: #fff;
            margin-bottom: 1rem;
        }

        #quiz-container {
            font-size: 4rem;
            margin: 2rem 0;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #answer-display {
            font-size: 1.2rem;
            color: var(--mario-coin);
            text-shadow: 2px 2px 0 #000;
            line-height: 1.4;
        }

        .instructions {
            font-size: 0.5rem;
            color: #ccc;
            margin-top: 1rem;
            line-height: 1.8;
        }

        /* Coin Animation */
        .coin-pop {
            position: fixed;
            font-size: 2rem;
            color: var(--mario-coin);
            pointer-events: none;
            animation: coinUp 0.6s ease-out forwards;
            z-index: 1000;
            text-shadow: 2px 2px 0 #000;
        }

        @keyframes coinUp {
            0% {
                transform: translateY(0) scale(0.5);
                opacity: 0;
            }

            50% {
                opacity: 1;
            }

            100% {
                transform: translateY(-100px) scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="background-wrap" id="background"></div>
    <div class="ground"></div>

    <a href="index.html" class="exit-btn">EXIT</a>

    <div id="start-screen" class="screen active">
        <h1>SUPER EMOJI<br>QUIZ BROS</h1>
        <div class="team-inputs">
            <input type="text" id="team1-name-input" placeholder="MARIO (TEAM 1)" maxlength="15">
            <input type="text" id="team2-name-input" placeholder="LUIGI (TEAM 2)" maxlength="15">
        </div>
        <div style="font-size: 0.6rem; color: #fff; margin-bottom: 1rem; opacity: 0.5;">A POÉTHRA PRODUCT</div>
        <div class="category-select" id="category-container">
            <button class="category-btn" data-category="music">SONGS</button>
            <button class="category-btn" data-category="film">MOVIES</button>
            <button class="category-btn" data-category="books">BOOKS</button>
            <button class="category-btn active" data-category="mix">MIX</button>
        </div>
        <button id="start-button">PRESS START</button>
    </div>

    <div id="game-screen" class="screen">
        <div id="score-container">
            <div id="team1-score">
                <span class="hud-label" id="team1-label">MARIO</span>
                <span class="hud-val">0000</span>
            </div>
            <div id="team2-score">
                <span class="hud-label" id="team2-label">LUIGI</span>
                <span class="hud-val">0000</span>
            </div>
        </div>
        <div id="question-counter"></div>
        <div id="quiz-container">
            <div id="emoji-display"></div>
            <div id="answer-display" style="display: none;"></div>
        </div>
        <div id="instructions" class="instructions"></div>
    </div>

    <div id="end-screen" class="screen">
        <h1 id="winner-message">THANK YOU!</h1>
        <p style="font-size: 0.8rem;">BUT YOUR WINNER IS IN ANOTHER CASTLE</p>
    </div>

    <script>
        const musicQuiz = [
            { emoji: "🎂🎉🎈", answer: "Happy Birthday" },
            { emoji: "🧊🧊👶", answer: "Ice Ice Baby" },
            { emoji: "🌧️☂️ella ella", answer: "Umbrella" },
            { emoji: "👋👋👋👋", answer: "Bye Bye Bye" },
            { emoji: "💃🕺🪩", answer: "Dance Monkey" },
            { emoji: "👑🐝💍", answer: "Single Ladies" },
            { emoji: "🧱🧱🧱", answer: "Another Brick in the Wall" },
            { emoji: "🔥🔥🔥", answer: "We Didn't Start the Fire" },
            { emoji: "👀🐯", answer: "Eye of the Tiger" },
            { emoji: "🌊🌊🌊", answer: "Rolling in the Deep" },
            { emoji: "🚶♂️🚶♂️🚶♂️🧟", answer: "Thriller" },
            { emoji: "🌈🛣️", answer: "Old Town Road" },
            { emoji: "💔🎸😭", answer: "Someone Like You" },
            { emoji: "🛑✋", answer: "Stop! In the Name of Love" },
            { emoji: "🌞☀️🌅", answer: "Here Comes the Sun" }
        ];

        const filmQuiz = [
            { emoji: "🧠🔄💤", answer: "Inception" },
            { emoji: "👻🚫🚫", answer: "Ghostbusters" },
            { emoji: "🕷️🧑🎓🏙️", answer: "Spider-Man: Into the Spider-Verse" },
            { emoji: "🦖🏝️🚁", answer: "Jurassic Park" },
            { emoji: "🤖❤️🌍", answer: "WALL-E" },
            { emoji: "🚀👨🚀🔥", answer: "The Martian" },
            { emoji: "🧑🍳🐀🍲", answer: "Ratatouille" },
            { emoji: "👑⚔️🩸", answer: "Gladiator" },
            { emoji: "🪄🧙♀️🧹💚", answer: "Wicked" },
            { emoji: "🏎️🌊⚡", answer: "Ford v Ferrari" },
            { emoji: "👩⚖️📺📣", answer: "The Social Network" },
            { emoji: "🧑🚓🧑⚖️🔪", answer: "Prisoners" },
            { emoji: "🐼🥋🔥", answer: "Kung Fu Panda" },
            { emoji: "👨👧🌎🧊", answer: "The Day After Tomorrow" },
            { emoji: "🎈🏠🌄", answer: "Up" }
        ];

        const booksQuiz = [
            { emoji: "👧🧹🪄", answer: "Cinderella" },
            { emoji: "🧛♂️🩸🏰", answer: "Dracula" },
            { emoji: "🐍🍎🌳", answer: "The Bible" },
            { emoji: "🐺🐺🐺🏠", answer: "The Three Little Pigs" },
            { emoji: "👸❄️", answer: "Snow White" },
            { emoji: " foxes 🦊🍇", answer: "Aesop’s Fables" },
            { emoji: "👦🏻🌲🧚♀️", answer: "Peter Pan" },
            { emoji: "🐢🐇", answer: "The Tortoise and the Hare" },
            { emoji: "👩🚂🚂🚂", answer: "The Little Engine That Could" },
            { emoji: "🧙♀️🍎🪞", answer: "Snow White and the Seven Dwarfs" },
            { emoji: "🦁👑", answer: "The Jungle Book" },
            { emoji: "🐉⚔️🏰", answer: "Beowulf" },
            { emoji: "👧🏻🧺🐺", answer: "Little Red Riding Hood" },
            { emoji: "🐻🥣🥣🥣", answer: "Goldilocks and the Three Bears" },
            { emoji: "🌊👴🎣", answer: "The Old Man and the Sea" }
        ];

        const mixQuiz = [
            { emoji: "🧙‍♂️💍🔥", answer: "The Lord of the Rings" },
            { emoji: "🧑‍🚀🚀🌕", answer: "Interstellar" },
            { emoji: "🧑‍🎤🚀✨", answer: "Rocketman" },
            { emoji: "🦁👑", answer: "The Lion King" },
            { emoji: "❄️👭🏰", answer: "Frozen" },
            { emoji: "🧑‍🏫📚✉️🧹⚡", answer: "Harry Potter" },
            { emoji: "🐠🔍🌊", answer: "Finding Nemo" },
            { emoji: "💀🏴‍☠️⛵", answer: "Pirates of the Caribbean" },
            { emoji: "👽📞🏠🚲🌕", answer: "E.T." },
            { emoji: "💃🕺❤️", answer: "La La Land" },
            { emoji: "👩🏻🚢💎❄️", answer: "Titanic" },
            { emoji: "🦇🌃🏙️", answer: "The Dark Knight" },
            { emoji: "🧛‍♂️💋☀️", answer: "Twilight" },
            { emoji: "🧑‍⚖️⚖️🔪", answer: "12 Angry Men" },
            { emoji: "🧑‍🌾👩‍🌾🚜🐖🐄", answer: "Charlotte’s Web" },
            { emoji: "👧🏻🐇🕳️🎩♠️", answer: "Alice in Wonderland" },
            { emoji: "🦸‍♂️🇺🇸🛡️", answer: "Captain America" },
            { emoji: "🧔🍷🍞🇫🇷", answer: "Les Misérables" },
            { emoji: "🐖🏝️🔥⚔️", answer: "Lord of the Flies" },
            { emoji: "🦋👁️‍🗨️🔒🧍‍♀️", answer: "The Girl with the Dragon Tattoo" },
            { emoji: "👧🏻🔥🚪📖", answer: "Matilda" },
            { emoji: "🐍🍎🌳👦👧", answer: "Genesis (Bible)" },
            { emoji: "🕵️‍♂️🔍🧢", answer: "Sherlock Holmes" },
            { emoji: "🕰️👶👴", answer: "The Curious Case of Benjamin Button" },
            { emoji: "👦📸🚪🪞", answer: "Coraline" },
            { emoji: "🧛‍♂️🩸🏰🌙", answer: "Dracula" },
            { emoji: "🧒🧸🌲⭐", answer: "Winnie the Pooh" },
            { emoji: "🧑‍🌾👠🌀🦁", answer: "The Wizard of Oz" },
            { emoji: "🧑‍🚀🐒🌍💣", answer: "Planet of the Apes" }
        ];

        let quizData = mixQuiz;

        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const endScreen = document.getElementById('end-screen');
        const startButton = document.getElementById('start-button');
        const team1ScoreEl = document.getElementById('team1-score');
        const team2ScoreEl = document.getElementById('team2-score');
        const emojiDisplay = document.getElementById('emoji-display');
        const answerDisplay = document.getElementById('answer-display');
        const instructionsEl = document.getElementById('instructions');
        const winnerMessageEl = document.getElementById('winner-message');
        const team1NameInput = document.getElementById('team1-name-input');
        const team2NameInput = document.getElementById('team2-name-input');
        const team1LabelEl = document.getElementById('team1-label');
        const team2LabelEl = document.getElementById('team2-label');
        const categoryContainer = document.getElementById('category-container');
        const categoryButtons = categoryContainer.querySelectorAll('.category-btn');
        const questionCounterEl = document.getElementById('question-counter');


        let team1Score = 0, team2Score = 0, currentQuestionIndex = 0, isShowingAnswer = false;
        let team1Name = "MARIO", team2Name = "LUIGI";
        let selectedCategory = "mix";

        // Create random clouds
        for (let i = 0; i < 6; i++) {
            const cloud = document.createElement('div');
            cloud.className = 'cloud';
            cloud.style.top = (Math.random() * 60) + '%';
            cloud.style.animationDuration = (Math.random() * 20 + 20) + 's';
            cloud.style.animationDelay = (Math.random() * 20) + 's';
            document.getElementById('background').appendChild(cloud);
        }

        // Category selection logic
        categoryButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                categoryButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedCategory = btn.dataset.category;
            });
        });

        function showScreen(screen) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            screen.classList.add('active');
        }

        function updateScores() {
            team1ScoreEl.querySelector('.hud-val').textContent = team1Score.toString().padStart(4, '0');
            team2ScoreEl.querySelector('.hud-val').textContent = team2Score.toString().padStart(4, '0');
            team1LabelEl.textContent = team1Name.toUpperCase();
            team2LabelEl.textContent = team2Name.toUpperCase();
        }

        function spawnCoin(team) {
            const coin = document.createElement('div');
            coin.className = 'coin-pop';
            coin.textContent = '🪙';
            const rect = team === 1 ? team1ScoreEl.getBoundingClientRect() : team2ScoreEl.getBoundingClientRect();
            coin.style.left = (rect.left + rect.width / 2) + 'px';
            coin.style.top = rect.top + 'px';
            document.body.appendChild(coin);
            setTimeout(() => coin.remove(), 600);
        }

        function displayQuestion() {
            if (currentQuestionIndex >= quizData.length) {
                endGame();
                return;
            }
            isShowingAnswer = false;
            emojiDisplay.textContent = quizData[currentQuestionIndex].emoji;
            answerDisplay.textContent = quizData[currentQuestionIndex].answer.toUpperCase();
            questionCounterEl.textContent = `WORLD ${currentQuestionIndex + 1} - ${quizData.length}`;
            emojiDisplay.style.display = 'block';
            answerDisplay.style.display = 'none';
            instructionsEl.innerHTML = "PRESS [↓] TO REVEAL<br>PRESS [→] TO SKIP";
        }

        function revealAnswer() {
            isShowingAnswer = true;
            emojiDisplay.style.display = 'none';
            answerDisplay.style.display = 'block';
            instructionsEl.innerHTML = "PRESS [1] OR [2] TO SCORE<br>PRESS [0] TO QUIT";
        }

        function awardPointAndNext(team) {
            if (!isShowingAnswer) return;
            if (team === 1) team1Score++; else if (team === 2) team2Score++;
            spawnCoin(team);
            updateScores();
            currentQuestionIndex++;
            displayQuestion();
        }

        function startGame() {
            team1Name = team1NameInput.value || "MARIO";
            team2Name = team2NameInput.value || "LUIGI";

            if (selectedCategory === "music") quizData = musicQuiz;
            else if (selectedCategory === "film") quizData = filmQuiz;
            else if (selectedCategory === "books") quizData = booksQuiz;
            else quizData = mixQuiz;

            team1Score = 0, team2Score = 0, currentQuestionIndex = 0;
            updateScores();
            displayQuestion();
            showScreen(gameScreen);
        }

        function endGame() {
            let winnerText = "IT'S A TIE!";
            if (team1Score > team2Score) winnerText = `${team1Name.toUpperCase()} IS THE CHAMP!`;
            else if (team2Score > team1Score) winnerText = `${team2Name.toUpperCase()} IS THE CHAMP!`;
            winnerMessageEl.innerHTML = winnerText + "<br>GAME OVER";
            showScreen(endScreen);
            launchConfetti();

            // Save badge data
            try {
                const badges = JSON.parse(localStorage.getItem('poethra_badges') || '{}');
                badges['emoji'] = true;
                localStorage.setItem('poethra_badges', JSON.stringify(badges));
            } catch (e) { console.error("Badge save failed", e); }
        }

        function launchConfetti() {
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = Math.random() * -50 + 'vh';
                confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
                confetti.style.animationDelay = Math.random() * 2 + 's';
                document.body.appendChild(confetti);
            }
        }

        startButton.addEventListener('click', startGame);

        document.addEventListener('keydown', (e) => {
            // Theme toggle on '8' key, works on any screen
            if (e.key === '8') {
                document.body.classList.toggle('light-mode');
            }

            if (!gameScreen.classList.contains('active')) return;

            // Ctrl + Escape to go back to start screen
            if (e.ctrlKey && e.key === 'Escape') {
                showScreen(startScreen);
                return;
            }

            // Alt + T to show winner screen
            if (e.altKey && e.key === 't') {
                endGame();
                return;
            }

            if (e.key === 'ArrowRight') {
                currentQuestionIndex++;
                displayQuestion();
                return;
            }

            if (isShowingAnswer) {
                if (e.key === '1') awardPointAndNext(1);
                else if (e.key === '2') awardPointAndNext(2);
                else if (e.key === '0') endGame();
            } else {
                if (e.key === 'ArrowDown') revealAnswer();
            }
        });

        // Presenter Mode Logic
        (function () {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('mode') !== 'presenter') return;

            console.log("Presenter Mode Active");

            // Click to Forward
            document.addEventListener('click', (e) => {
                if (e.target.closest('button') || e.target.closest('a') || e.target.closest('input')) return;
                if (!gameScreen.classList.contains('active')) return;

                if (isShowingAnswer) {
                    awardPointAndNext(1); // Default to Team 1
                } else {
                    revealAnswer();
                }
            });

            // Swipe to Skip
            let touchstartX = 0;
            document.addEventListener('touchstart', e => { touchstartX = e.changedTouches[0].screenX; }, false);
            document.addEventListener('touchend', e => {
                const dx = e.changedTouches[0].screenX - touchstartX;
                if (Math.abs(dx) > 50 && gameScreen.classList.contains('active')) {
                    currentQuestionIndex++;
                    displayQuestion();
                }
            }, false);
        })();
    </script>
