<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist Duel: Higher or Lower</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');

        :root {
            --primary: #1DB954;
            --secondary: #191414;
            --text: #FFFFFF;
            --accent: #FFFFFF;
            --transition: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--secondary);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
        }

        /* Setup Screen - Flat */
        #setup-screen {
            position: fixed;
            inset: 0;
            background: var(--secondary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
            transition: opacity 0.5s var(--transition);
        }

        .setup-card {
            background: #282828;
            padding: 40px;
            border: 2px solid #3e3e3e;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .setup-card h1 {
            margin-bottom: 24px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .setup-card input {
            width: 100%;
            padding: 16px;
            margin-bottom: 16px;
            border: 2px solid #3e3e3e;
            background: #121212;
            color: white;
            font-family: inherit;
            font-size: 1rem;
        }

        .primary-btn {
            background: var(--primary);
            color: black;
            border: none;
            padding: 16px 32px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 1rem;
            margin-top: 10px;
        }

        .primary-btn:hover {
            background: #1ed760;
        }

        .exit-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            color: var(--text);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 700;
            z-index: 2001;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.2s;
        }

        .exit-btn:hover {
            background: #fff;
            color: #000;
        }

        /* Game Layout */
        #game-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 100vh;
            position: relative;
        }

        .artist-panel {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
            overflow: hidden;
            transition: transform 0.6s var(--transition);
        }

        .artist-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            z-index: -1;
            transition: opacity 0.5s ease;
        }

        .artist-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 0;
        }

        .artist-content {
            position: relative;
            z-index: 10;
            width: 100%;
        }

        .artist-name {
            font-size: 4.5rem;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 0.9;
            margin-bottom: 10px;
        }

        .has {
            font-size: 1.5rem;
            font-weight: 500;
            opacity: 0.8;
            margin-bottom: 20px;
        }

        .popularity-score {
            font-size: 6rem;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .popularity-label {
            font-size: 1rem;
            letter-spacing: 4px;
            opacity: 0.6;
            text-transform: uppercase;
        }

        /* Controls - Flat */
        .game-controls {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .choice-btn {
            background: transparent;
            border: 3px solid white;
            color: white;
            padding: 15px 40px;
            font-weight: 700;
            font-family: inherit;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
            width: 250px;
        }

        .choice-btn:hover {
            background: white;
            color: black;
        }

        /* VS Element - Flat */
        .vs-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            background: white;
            color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 1.5rem;
            z-index: 100;
        }

        .hidden {
            display: none !important;
        }

        /* Result Overlays - Flat */
        #result-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .result-icon {
            font-size: 15rem;
            font-weight: 900;
        }

        .correct {
            color: #1DB954;
        }

        .wrong {
            color: #E91E63;
        }

        /* Transition Animations */
        .shifting-left {
            transform: translateX(-100%);
            transition: transform 0.8s var(--transition);
        }

        .fade-out {
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* Instructions */
        .instructions {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            opacity: 0.5;
            letter-spacing: 2px;
            z-index: 100;
        }
    </style>
</head>

<body>
    <a href="index.html" class="exit-btn">EXIT</a>

    <!-- Setup Screen -->
    <div id="setup-screen">
        <div class="setup-card">
            <h1>SPOTIFY AUTH</h1>
            <p style="margin-bottom: 20px; font-size: 0.9rem; opacity: 0.7;">Enter your Spotify Client ID and Secret to
                fetch artists.</p>
            <input type="text" id="client-id" placeholder="Client ID">
            <input type="password" id="client-secret" placeholder="Client Secret">
            <button class="primary-btn" onclick="saveCredentials()">INITIALIZE</button>
        </div>
    </div>

    <!-- Instructions -->
    <div class="instructions">PRESS [H] FOR HIGHER OR [L] FOR LOWER</div>

    <!-- VS Circle -->
    <div class="vs-circle hidden" id="vs-element">VS</div>

    <!-- Result Overlay -->
    <div id="result-overlay">
        <div class="result-icon" id="result-icon"></div>
    </div>

    <!-- Game Container -->
    <div id="game-container" class="hidden">
        <!-- Left Panel -->
        <div class="artist-panel" id="left-panel">
            <div class="artist-bg" id="left-bg"></div>
            <div class="artist-overlay"></div>
            <div class="artist-content" id="left-content">
                <div class="artist-name" id="left-name">...</div>
                <div class="has">HAS A POPULARITY SCORE OF</div>
                <div class="popularity-score" id="left-score">0</div>
                <div class="popularity-label">OUT OF 100</div>
                <div style="font-size: 0.6rem; opacity: 0.3; margin-top: 40px; letter-spacing: 2px;">POÉTHRA</div>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="artist-panel" id="right-panel">
            <div class="artist-bg" id="right-bg"></div>
            <div class="artist-overlay"></div>
            <div class="artist-content" id="right-content">
                <div class="artist-name" id="right-name">...</div>
                <div class="has">HAS A</div>
                <div class="game-controls" id="player-controls">
                    <button class="choice-btn" onclick="makeChoice('higher')">HIGHER</button>
                    <button class="choice-btn" onclick="makeChoice('lower')">LOWER</button>
                </div>
                <!-- This will be revealed after choice -->
                <div id="right-score-reveal" class="hidden">
                    <div class="popularity-score" id="right-score">0</div>
                    <div class="popularity-label">OUT OF 100</div>
                </div>
                <div class="has" style="margin-top: 20px;">POPULARITY SCORE THAN <span id="ref-artist-name">...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY_ID = 'spotify_client_id';
        const API_KEY_SECRET = 'spotify_client_secret';

        let accessToken = '';
        let currentLeftArtist = null;
        let currentRightArtist = null;

        const popularArtists = [
            'Taylor Swift', 'Drake', 'The Weeknd', 'Billie Eilish', 'Ariana Grande',
            'Ed Sheeran', 'Justin Bieber', 'Dua Lipa', 'Olivia Rodrigo', 'Bad Bunny',
            'Travis Scott', 'Kendrick Lamar', 'Post Malone', 'SZA', 'Harry Styles',
            'Doja Cat', 'Imagine Dragons', 'Coldplay', 'Lana Del Rey', 'Bruno Mars',
            'Rihanna', 'Eminem', 'Kanye West', 'Tyler, The Creator', 'Frank Ocean',
            'Arctic Monkeys', 'One direction', 'Selena Gomez', 'Radiohead', 'Micheal Jackson',
            'Linkin Park', 'Twenty One Pilots', 'Jonas brothers', 'Justin Timberlake', 'Alan Walker',
            'Charlie Puth', 'Calvin Harris', 'David Guetta', 'Marshmello', 'Skrillex',
            'BTS', 'BLACKPINK', 'ROSÉ', 'Arijit Singh', 'Pritam',
            'Shreya Ghoshal', 'A. R. Rahman', 'Neha Kakkar', 'Badshah', 'Diljit Dosanjh'
        ];

        let artistPool = [];

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function refillPool(excludeName) {
            artistPool = shuffle([...popularArtists]);
            if (excludeName) {
                artistPool = artistPool.filter(name => name !== excludeName);
            }
        }

        // --- Auth ---
        async function saveCredentials() {
            const id = document.getElementById('client-id').value;
            const secret = document.getElementById('client-secret').value;
            if (!id || !secret) return alert('Enter ID and Secret');
            localStorage.setItem(API_KEY_ID, id);
            localStorage.setItem(API_KEY_SECRET, secret);
            initializeGame();
        }

        async function getAccessToken() {
            const id = localStorage.getItem(API_KEY_ID);
            const secret = localStorage.getItem(API_KEY_SECRET);
            const res = await fetch('https://accounts.spotify.com/api/token', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'Authorization': 'Basic ' + btoa(id + ':' + secret)
                },
                body: 'grant_type=client_credentials'
            });
            const data = await res.json();
            if (data.error) throw new Error(data.error_description);
            return data.access_token;
        }

        async function initializeGame() {
            try {
                accessToken = await getAccessToken();
                document.getElementById('setup-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('setup-screen').classList.add('hidden');
                    document.getElementById('game-container').classList.remove('hidden');
                    document.getElementById('vs-element').classList.remove('hidden');
                    setupInitialRound();
                }, 500);
            } catch (e) {
                alert('Auth failed: ' + e.message);
            }
        }

        async function fetchArtist(name) {
            const res = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(name)}&type=artist&limit=1`, {
                headers: { 'Authorization': 'Bearer ' + accessToken }
            });
            const data = await res.json();
            return data.artists.items[0];
        }

        async function setupInitialRound() {
            refillPool();
            const name1 = artistPool.pop();
            const name2 = artistPool.pop();
            currentLeftArtist = await fetchArtist(name1);
            currentRightArtist = await fetchArtist(name2);
            updateUI();
        }

        function updateUI() {
            // Left
            document.getElementById('left-name').textContent = currentLeftArtist.name;
            document.getElementById('left-score').textContent = currentLeftArtist.popularity;
            document.getElementById('left-bg').style.backgroundImage = `url(${currentLeftArtist.images[0]?.url})`;

            // Right
            document.getElementById('right-name').textContent = currentRightArtist.name;
            document.getElementById('right-bg').style.backgroundImage = `url(${currentRightArtist.images[0]?.url})`;
            document.getElementById('ref-artist-name').textContent = currentLeftArtist.name;

            document.getElementById('player-controls').classList.remove('hidden');
            document.getElementById('right-score-reveal').classList.add('hidden');

            // Reset transforms/opacity
            document.getElementById('left-panel').style.transform = '';
            document.getElementById('right-panel').style.transform = '';
        }

        async function makeChoice(choice) {
            const ref = currentLeftArtist.popularity;
            const target = currentRightArtist.popularity;
            let correct = false;
            if (choice === 'higher' && target >= ref) correct = true;
            if (choice === 'lower' && target <= ref) correct = true;

            // Reveal Right
            document.getElementById('player-controls').classList.add('hidden');
            document.getElementById('right-score-reveal').classList.remove('hidden');

            // Number roll
            animateValue('right-score', 0, target, 800);

            setTimeout(() => {
                showResult(correct);
                setTimeout(nextRoundTransition, 1500);
            }, 1000);
        }

        function animateValue(id, start, end, duration) {
            const obj = document.getElementById(id);
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) window.requestAnimationFrame(step);
            };
            window.requestAnimationFrame(step);
        }

        function showResult(success) {
            const overlay = document.getElementById('result-overlay');
            const icon = document.getElementById('result-icon');
            icon.textContent = success ? 'CORRECT' : 'WRONG';
            icon.className = 'result-icon ' + (success ? 'correct' : 'wrong');
            overlay.style.opacity = '1';
            setTimeout(() => { overlay.style.opacity = '0'; }, 1000);
        }

        async function nextRoundTransition() {
            // The magic happens here: Right becomes Left.

            const leftPanel = document.getElementById('left-panel');
            const rightPanel = document.getElementById('right-panel');
            const vs = document.getElementById('vs-element');

            // 1. Slide Left panel away to the left
            leftPanel.style.transform = 'translateX(-100%)';

            // 2. Slide Right panel to the center-left position (where Left was)
            // Since it's a grid, we need it to move by -100% of its width
            rightPanel.style.transform = 'translateX(-100%)';

            // Hide VS during transition
            vs.style.opacity = '0';

            setTimeout(async () => {
                // Swap artists data
                currentLeftArtist = currentRightArtist;

                // Fetch next artist for the right from the pool
                if (artistPool.length === 0) {
                    refillPool(currentLeftArtist.name);
                }
                const nextName = artistPool.pop();
                currentRightArtist = await fetchArtist(nextName);

                // Instantly swap content without transition
                leftPanel.style.transition = 'none';
                rightPanel.style.transition = 'none';

                // Update images/text
                updateUI();

                // Show panels again and VS
                setTimeout(() => {
                    leftPanel.style.transition = '';
                    rightPanel.style.transition = '';
                    vs.style.opacity = '1';
                }, 50);
            }, 800);
        }

        // Init
        if (localStorage.getItem(API_KEY_ID)) {
            document.getElementById('client-id').value = localStorage.getItem(API_KEY_ID);
            document.getElementById('client-secret').value = localStorage.getItem(API_KEY_SECRET);
        }

        document.addEventListener('keydown', (e) => {
            const containerHidden = document.getElementById('game-container').classList.contains('hidden');
            const controlsHidden = document.getElementById('player-controls').classList.contains('hidden');
            if (containerHidden || controlsHidden) return;
            if (e.key.toLowerCase() === 'h') makeChoice('higher');
            if (e.key.toLowerCase() === 'l') makeChoice('lower');
        });
    </script>
</body>

</html>
